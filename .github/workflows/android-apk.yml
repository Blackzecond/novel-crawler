name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL ของ Novel Crawler ที่ deploy แล้ว เช่น https://your-app.vercel.app (กรอกโดเมนเปล่าได้)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Normalize and validate app URL
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.CAPACITOR_SERVER_URL?.trim();
          if (!raw) throw new Error('App URL is required.');
          const normalized = /^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : `https://${raw}`;
          const url = new URL(normalized);
          if (!['https:', 'http:'].includes(url.protocol) || !url.hostname || url.username || url.password) {
            throw new Error('Enter a valid HTTP(S) app URL.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `CAPACITOR_SERVER_URL=${url.origin}${url.pathname.replace(/\/$/, '')}\n`);
          console.log('Building wrapper for', url.origin);
          NODE

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/debug-signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-crawler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
